<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="data:,">
<title>AP · 设计师品牌集合店</title>
<style>
  :root{
    --paper:#F1EBE3;
    --card:#FBF8F3;
    --ink:#26211D;
    --ink-soft:#4A423A;
    --muted:#8A7C6E;
    --line:#E4DBCE;
    --accent:#A98467;
    --gold:#C6A15B;
    --cream:#F7F2E9;
    --radius:16px;
    --shadow:0 12px 32px rgba(60,45,30,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--paper);color:var(--ink);
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  img{display:block;max-width:100%}

  /* ===== 顶栏 ===== */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;
    background:linear-gradient(rgba(20,16,12,.55), rgba(20,16,12,0));
    transition:background .3s ease;
  }
  .topbar.scrolled{background:rgba(30,24,19,.92);backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:baseline;gap:8px}
  .brand .logo{font-family:Georgia,"Songti SC",serif;font-size:22px;font-weight:700;letter-spacing:.1em;color:#F5EDE2}
  .brand .logo i{font-style:normal;color:var(--gold)}
  .brand small{font-size:10px;color:rgba(245,237,226,.65);letter-spacing:.24em}
  .topbar .contact{font-size:12px;color:#F5EDE2;letter-spacing:.12em;padding:8px 14px;border:1px solid rgba(245,237,226,.35);border-radius:999px;transition:all .25s}
  .topbar .contact:hover{background:rgba(245,237,226,.12)}

  /* ===== 首页壁纸 ===== */
  .hero{position:relative;width:100%;height:86vh;min-height:520px;overflow:hidden;background:#241C14;background-image:url('images/hero.jpg?v=4');background-size:cover;background-position:center 22%;background-repeat:no-repeat}
  .hero .shade{position:absolute;inset:0;background:linear-gradient(180deg, rgba(18,13,9,.35) 0%, rgba(18,13,9,.05) 40%, rgba(18,13,9,.75) 100%)}
  .hero .hero-inner{position:absolute;left:0;right:0;bottom:0;padding:0 24px 30px;color:#F5EDE2}
  .hero .eyebrow{font-size:11px;letter-spacing:.42em;color:rgba(198,161,91,.95);margin-bottom:12px}
  .hero h1{font-family:Georgia,"Songti SC",serif;font-size:40px;font-weight:700;letter-spacing:.06em;text-shadow:0 2px 18px rgba(0,0,0,.35)}
  .hero .sub{font-size:13px;letter-spacing:.26em;color:rgba(245,237,226,.78);margin-top:10px}
  .hero .scroll-hint{position:absolute;bottom:14px;right:20px;color:rgba(245,237,226,.45);font-size:20px;animation:float 2.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  main{max-width:1120px;margin:0 auto;padding:0 16px 70px}

  /* ===== 分类筛选 ===== */
  .filters{position:sticky;top:0;z-index:50;background:rgba(241,235,227,.93);backdrop-filter:blur(10px);padding:14px 0 12px;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .filters .row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px}
  .filters .row::-webkit-scrollbar{display:none}
  .filter-chip{flex:none;padding:9px 20px;border-radius:999px;font-size:13px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);transition:all .25s;letter-spacing:.08em}
  .filter-chip.on{background:#2A231D;color:#F5EDE2;border-color:#2A231D;box-shadow:0 4px 14px rgba(42,35,29,.25)}

  /* ===== 商品双栏网格 ===== */
  .section-eyebrow{display:flex;align-items:center;gap:10px;margin:34px 0 16px}
  .section-eyebrow .line{flex:1;height:1px;background:var(--line)}
  .section-eyebrow span{font-size:11px;letter-spacing:.34em;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .p-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .3s ease, box-shadow .3s ease}
  .p-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .p-card .thumb{aspect-ratio:3/3.8;overflow:hidden;background:#EDE6DA;position:relative}
  .p-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
  .p-card:hover .thumb img{transform:scale(1.06)}
  .p-card .thumb .badge{position:absolute;left:10px;top:10px;background:rgba(20,15,10,.62);color:#F0E3CF;font-size:10px;letter-spacing:.16em;padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
  .p-card .meta{padding:12px 14px 14px}
  .p-card .meta h4{font-size:14px;font-weight:600;letter-spacing:.02em}
  .p-card .meta p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .p-card .meta .tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
  .p-card .meta .tags span{font-size:10px;padding:2px 8px;border-radius:999px;background:#F0E7DA;color:#8A6F52}

  /* 福利横幅 */
  .banner{margin-top:26px;background:linear-gradient(120deg,#3A2F24,#55402B);color:#EFE3CE;border-radius:var(--radius);padding:22px;position:relative;overflow:hidden}
  .banner::after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(198,161,91,.14)}
  .banner h4{font-family:Georgia,serif;font-size:17px;letter-spacing:.12em;color:#D8B87C}
  .banner p{font-size:13px;line-height:1.9;margin-top:8px;color:rgba(239,227,206,.85)}

  /* ===== 每日搭配 ===== */
  .look-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .look-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .3s ease, box-shadow .3s ease}
  .look-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .look-card .thumb{aspect-ratio:1;overflow:hidden;background:#E9E6DA;position:relative}
  .look-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
  .look-card:hover .thumb img{transform:scale(1.05)}
  .look-card .thumb .day{position:absolute;left:10px;top:10px;background:rgba(42,35,29,.62);color:#F0E3CF;font-size:10px;letter-spacing:.14em;padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
  .look-card .meta{padding:12px 14px 14px}
  .look-card .meta h4{font-size:14px;font-weight:600;font-family:Georgia,"Songti SC",serif;letter-spacing:.03em}
  .look-card .meta p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ===== 店铺信息 ===== */
  .info-section{margin-top:8px;display:grid;grid-template-columns:1fr;gap:12px}
  .info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;align-items:center;gap:14px}
  .info-card .icon{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;background:#F1E7D8}
  .info-card h4{font-size:14px;font-weight:600}
  .info-card p{font-size:13px;color:var(--muted);margin-top:3px}
  .info-card .placeholder{color:#C4B6A4;font-style:italic}
  .info-card .qr-placeholder{margin-left:auto;width:64px;height:64px;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#C4B6A4;text-align:center;flex:none}

  footer{margin:0 auto;padding:0 16px 36px;color:var(--muted);font-size:11px;text-align:center;line-height:1.9;letter-spacing:.06em}
  footer a{color:var(--muted);text-decoration:none}

  /* ===== 抽屉 ===== */
  .mask{position:fixed;inset:0;background:rgba(30,22,15,.5);opacity:0;transition:opacity .3s ease;z-index:90;backdrop-filter:blur(4px);pointer-events:none}
  .mask.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,92vw);background:#FCFAF5;z-index:95;transform:translateX(105%);transition:transform .42s cubic-bezier(.22,.61,.28,1);box-shadow:-24px 0 70px rgba(40,25,10,.22);display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer-head{padding:24px 22px 14px;border-bottom:1px solid var(--line)}
  .drawer-head .kicker{font-size:10px;letter-spacing:.3em;color:var(--accent);font-weight:600}
  .drawer-head h3{font-size:23px;font-family:Georgia,"Songti SC",serif;margin-top:6px}
  .drawer-head p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
  .drawer-body{flex:1;overflow-y:auto;padding:18px 22px 24px;-webkit-overflow-scrolling:touch}
  .d-img{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#EBE3D6;margin-bottom:16px}
  .d-img img{width:100%;height:100%;object-fit:cover}
  .d-title{font-size:19px;font-weight:600;font-family:Georgia,"Songti SC",serif}
  .d-desc{font-size:13.5px;color:var(--muted);line-height:1.75;margin-top:8px}
  .d-tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .d-tags span{font-size:11px;padding:3px 11px;border-radius:999px;background:#F3E9DA;color:#8A6B44}
  .d-more{margin-top:16px;font-size:12.5px;color:var(--accent);letter-spacing:.1em}
  .drawer-foot{padding:14px 22px 24px}
  .drawer-foot button{width:100%;padding:14px;border-radius:999px;background:#2A231E;color:#F5EDE2;font-size:15px;letter-spacing:.14em;transition:all .2s}
  .drawer-foot button:hover{background:#14100C}

  /* 搭配详情 */
  .look-detail{display:none;position:fixed;inset:0;background:var(--paper);z-index:110;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .look-detail.show{display:block}
  .look-detail .hero-img{position:relative}
  .look-detail .hero-img img{width:100%;max-height:56vh;object-fit:cover}
  .look-detail .close{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:rgba(252,248,240,.94);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.16);transition:transform .2s;z-index:20}
  .look-detail .close:hover{transform:rotate(90deg)}
  .look-detail .body{max-width:660px;margin:0 auto;padding:22px 20px 64px}
  .look-detail .day{font-size:11px;letter-spacing:.3em;color:var(--accent);font-weight:600}
  .look-detail h2{font-family:Georgia,"Songti SC",serif;font-size:27px;margin:8px 0 10px}
  .look-detail .sub{color:var(--muted);font-size:14px;line-height:1.8}
  .look-detail .items{margin-top:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .look-detail .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .look-detail .item b{font-size:13.5px;display:block}
  .look-detail .item span{font-size:11.5px;color:var(--muted);display:block;margin-top:3px}
  .look-detail .tip{margin-top:20px;background:#F1E9DC;border-radius:14px;padding:14px 16px;font-size:13px;color:#6E5F4C;line-height:1.75}

  @media (min-width:720px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .look-grid{grid-template-columns:repeat(4,1fr)}
    .info-section{grid-template-columns:repeat(3,1fr)}
    .hero h1{font-size:56px}
    .hero{height:78vh}
  }
  @media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <div class="brand">
    <div class="logo">A<i>P</i></div>
    <small>设计师品牌集合店</small>
  </div>
  <button class="contact" onclick="document.getElementById('store-info').scrollIntoView({behavior:'smooth'})">联系店铺</button>
</header>

<div class="hero">
  <div class="shade"></div>
  <div class="hero-inner">
    <div class="eyebrow">ALWAYS PRETTY</div>
    <h1>AP 设计师品牌集合店</h1>
    <div class="sub">精选好衣 · 每日搭配</div>
  </div>
  <div class="scroll-hint">⌄</div>
</div>

<main>
  <div class="filters"><div class="row" id="filtersRow"></div></div>
  <div class="grid" id="productGrid"></div>
  <div class="banner" id="benefitBanner" style="display:none"></div>

  <div class="section-eyebrow"><span>每日搭配</span><div class="line"></div><span>DAILY LOOKS</span></div>
  <div class="look-grid" id="lookGrid"></div>

  <div class="section-eyebrow" id="store-info"><span>联系店铺</span><div class="line"></div></div>
  <div class="info-section">
    <div class="info-card"><div class="icon">📍</div><div><h4>店铺地址</h4><p class="placeholder" id="infoAddr">（待填写）</p></div></div>
    <div class="info-card"><div class="icon">📞</div><div><h4>联系电话</h4><p class="placeholder" id="infoTel">（待填写）</p></div></div>
    <div class="info-card"><div class="icon">💬</div><div><h4>微信群 / 客服微信</h4><p class="placeholder" id="infoWx">（待填写）</p></div><div class="qr-placeholder" id="qrInfo">二维码<br>待上传</div></div>
  </div>
</main>

<footer>
  AP · 设计师品牌集合店 · <a href="admin.html">管理</a><br>
  到店试穿 · 每日上新
</footer>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot"><button id="drawerClose">返回继续逛</button></div>
</aside>

<div class="look-detail" id="lookDetail">
  <button class="close" id="lookClose" aria-label="关闭">✕</button>
  <div id="lookDetailBody"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let DATA = null;
let currentFilter = 'all';
const FILTERS = [
  { id:'all',   label:'全部' },
  { id:'new',   label:'本周上新' },
  { id:'tops',  label:'上装' },
  { id:'skirts',label:'裙装' },
  { id:'pants', label:'裤装' }
];
const ZONE_META = { new:{kicker:'本周上新'}, tops:{kicker:'上装区'}, skirts:{kicker:'裙装区'}, pants:{kicker:'裤装区'} };

async function loadData(){
  try {
    const r = await fetch('data.json?t=' + Date.now());
    DATA = await r.json();
    renderAll();
  } catch(e){
    console.error('数据加载失败', e);
    document.getElementById('productGrid').innerHTML = '<p style="color:#8A7C6E;padding:30px;text-align:center">数据加载失败，请稍后刷新</p>';
  }
}

function renderFilters(){
  $('#filtersRow').innerHTML = FILTERS.map(f => `<button class="filter-chip${f.id===currentFilter?' on':''}" onclick="setFilter('${f.id}')">${f.label}</button>`).join('');
}
function setFilter(id){
  currentFilter = id;
  renderFilters(); renderGrid();
}
function allItems(){
  const items = [];
  ['new','tops','skirts','pants'].forEach(z => {
    const zone = DATA.zones[z];
    if(zone && zone.items) zone.items.forEach(it => items.push({...it, zone:z}));
  });
  return items;
}
function renderGrid(){
  let items;
  if(currentFilter === 'all') items = allItems();
  else items = (DATA.zones[currentFilter] && DATA.zones[currentFilter].items || []).map(it => ({...it, zone:currentFilter}));
  if(!items.length){ $('#productGrid').innerHTML = '<p style="color:#8A7C6E;padding:30px;text-align:center">这个区还没有商品</p>'; return; }
  $('#productGrid').innerHTML = items.map(it => `
    <div class="p-card" onclick="openProduct('${it.zone}',${findIndex(it.zone, it)})">
      <div class="thumb"><img src="${it._local || it.img}" alt="${it.t}" loading="lazy">${it.tags&&it.tags[0]?`<span class="badge">${it.tags[0]}</span>`:''}</div>
      <div class="meta"><h4>${it.t}</h4><p>${it.d}</p><div class="tags">${(it.tags||[]).slice(1).map(x=>`<span>${x}</span>`).join('')}</div></div>
    </div>`).join('');
}
function findIndex(zone, it){
  const arr = DATA.zones[zone] && DATA.zones[zone].items || [];
  for(let i=0;i<arr.length;i++){ if(arr[i]===it) return i; }
  return 0;
}

function openProduct(zone, idx){
  const it = DATA.zones[zone].items[idx];
  const meta = ZONE_META[zone] || {};
  $('#drawerHead').innerHTML = `<div class="kicker">${meta.kicker || 'AP SELECT'}</div><h3>${it.t}</h3>`;
  $('#drawerBody').innerHTML = `
    <div class="d-img"><img src="${it._local || it.img}" alt="${it.t}"></div>
    <div class="d-title">${it.t}</div>
    <div class="d-desc">${it.d}</div>
    <div class="d-tags">${(it.tags||[]).map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="d-more">喜欢可到店试穿 · 欢迎到店选购</div>`;
  openDrawer();
}
function openDrawer(){
  history.pushState({drawer:true}, '');
  $('#mask').classList.add('show');
  $('#drawer').classList.add('show');
  $('#drawer').setAttribute('aria-hidden','false');
}
function closeDrawer(){
  $('#mask').classList.remove('show');
  $('#drawer').classList.remove('show');
  $('#drawer').setAttribute('aria-hidden','true');
}
$('#drawerClose').addEventListener('click', closeDrawer);
$('#mask').addEventListener('click', closeDrawer);

function renderLooks(){
  $('#lookGrid').innerHTML = (DATA.looks||[]).map((l,i) => `
    <div class="look-card" onclick="openLook(${i})">
      <div class="thumb"><img src="${l._local||l.img}" alt="${l.name}" loading="lazy"><span class="day">${l.day}</span></div>
      <div class="meta"><h4>${l.name}</h4><p>${l.sub}</p></div>
    </div>`).join('');
}
function openLook(i){
  const l = DATA.looks[i];
  history.pushState({look:true}, '');
  $('#lookDetailBody').innerHTML = `
    <div class="hero-img"><img src="${l._local||l.img}" alt="${l.name}"></div>
    <div class="body">
      <div class="day">${l.day} · 每日搭配</div>
      <h2>${l.name}</h2>
      <p class="sub">${l.sub}</p>
      <div class="items">${l.items.map(x=>`<div class="item"><b>${x}</b><span>可在店内试穿</span></div>`).join('')}</div>
      <div class="tip">搭配小抄：${l.tip}</div>
    </div>`;
  $('#lookDetail').classList.add('show');
}
$('#lookClose').addEventListener('click', ()=> $('#lookDetail').classList.remove('show'));

function renderBanner(){
  const note = DATA.zones.cashier && DATA.zones.cashier.note;
  if(note){
    const b = $('#benefitBanner');
    b.style.display = 'block';
    b.innerHTML = `<h4>本周到店福利</h4><p>${note.replace(/\n/g,'<br>')}</p>`;
  }
}
function renderStoreInfo(){
  const s = DATA.storeInfo || {};
  if(s.address) $('#addrInfo').textContent = s.address;
  if(s.phone) $('#infoTel').textContent = s.phone;
  if(s.wechat) $('#infoWx').textContent = s.wechat;
  if(s.wechatQR){ $('#qrInfo').innerHTML = `<img src="${s.wechatQR}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`; $('#qrInfo').style.border='none'; }
}

/* 微信返回键：先关抽屉/详情，不退出页面 */
window.addEventListener('popstate', () => {
  if($('#drawer').classList.contains('show')){ closeDrawer(); return; }
  if($('#lookDetail').classList.contains('show')){ $('#lookDetail').classList.remove('show'); return; }
});

window.addEventListener('scroll', () => {
  $('#topbar').classList.toggle('scrolled', window.scrollY > 40);
});

function renderAll(){ renderFilters(); renderGrid(); renderLooks(); renderBanner(); renderStoreInfo(); }
loadData();
</script>
</body>
</html>
