<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>AP · Always Pretty</title>
<style>
  :root{
    --paper:#F6F1E8;
    --paper-2:#FBF6EE;
    --ink:#3B3733;
    --muted:#8C8378;
    --line:#E5DCCB;
    --blush:#F2C9C2;
    --coral:#DE8577;
    --sage:#9FB6A2;
    --gold:#C9A87C;
    --mist:#AEC3D4;
    --shadow:0 18px 50px rgba(90,70,50,.16);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  img{display:block;max-width:100%}

  /* ===== 顶栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;
    background:rgba(253,255,244,.86);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:10px;line-height:1.15}
  .brand .logo{
    font-family:Georgia,"Songti SC",serif;
    font-size:24px;font-weight:700;letter-spacing:.06em;color:#4A3F32;
  }
  .brand .logo span{color:var(--coral)}
  .brand small{font-size:11px;color:var(--muted);letter-spacing:.22em}
  .topbar .right{display:flex;gap:8px;align-items:center}
  .pill-btn{
    padding:8px 16px;border-radius:999px;font-size:13px;color:var(--ink);
    border:1px solid var(--line);background:rgba(255,253,246,.6);
    transition:all .25s ease;
  }
  .pill-btn:hover{background:#fff;box-shadow:0 4px 12px rgba(90,70,40,.1)}

  /* ===== 主内容 ===== */
  main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}

  /* 场景卡片 */
  .stage{
    position:relative;border-radius:26px;overflow:hidden;
    background:var(--paper-2);border:1px solid var(--line);
    box-shadow:var(--shadow);
  }
  .stage svg{width:100%;height:auto;display:block}
  .stage-hint{
    position:absolute;left:16px;bottom:16px;z-index:5;
    display:flex;align-items:center;gap:8px;
    background:rgba(255,253,246,.9);border:1px solid var(--line);
    padding:9px 16px;border-radius:999px;
    font-size:13px;color:var(--muted);
    box-shadow:0 6px 18px rgba(90,70,40,.12);
    backdrop-filter:blur(6px);
    animation:hintPulse 3s ease-in-out infinite;
  }
  .stage-hint .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);animation:dotBlink 1.6s infinite}
  @keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes hintPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .back-btn{
    position:fixed;left:16px;top:74px;z-index:40;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,253,246,.94);border:1px solid var(--line);
    padding:9px 16px;border-radius:999px;font-size:13px;color:var(--ink);
    box-shadow:0 6px 16px rgba(90,70,40,.16);transition:transform .2s;
  }
  .back-btn:hover{transform:translateX(-3px)}

  /* ===== SVG 交互 ===== */
  .hotzone{fill:#fff;fill-opacity:0;cursor:pointer;transition:fill-opacity .3s ease}
  .hotzone:hover{fill:#fff;fill-opacity:.14}
  .hotzone:focus-visible{outline:none;fill:#fff;fill-opacity:.22}

  /* 场景切换动画 */
  .stage-wrap{position:relative}
  .scene{
    transition:opacity .55s ease, transform .55s cubic-bezier(.22,.8,.28,1);
  }
  .scene.leaving{position:absolute;inset:0;opacity:0;transform:scale(1.06);pointer-events:none}
  .scene.active{opacity:1;transform:scale(1)}

  /* ===== 每日搭配（内嵌主页） ===== */
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-top:36px;margin-bottom:18px}
  .section-head .left h2{font-family:Georgia,"Songti SC",serif;font-size:28px;font-weight:600;letter-spacing:.03em}
  .section-head .left p{color:var(--muted);font-size:14px;margin-top:6px}
  .section-head .right{font-size:13px;color:var(--coral);font-weight:600;letter-spacing:.08em}
  .look-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .look-card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:transform .3s ease, box-shadow .3s ease;
  }
  .look-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
  .look-card .thumb{aspect-ratio:4/4.6;overflow:hidden;background:var(--paper)}
  .look-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
  .look-card:hover .thumb img{transform:scale(1.05)}
  .look-card .meta{padding:14px 16px 16px}
  .look-card .meta .day{font-size:11px;color:var(--coral);letter-spacing:.2em;font-weight:600}
  .look-card .meta h3{font-size:17px;margin:5px 0 6px;font-family:Georgia,"Songti SC",serif}
  .look-card .meta p{font-size:13px;color:var(--muted);line-height:1.55}
  .look-card .meta .tag{margin-top:10px;display:inline-block;font-size:11px;color:var(--coral);border:1px solid #EAC7C0;border-radius:999px;padding:3px 10px}

  /* ===== 店铺信息 ===== */
  .info-section{
    margin-top:36px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;
  }
  .info-card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 22px 20px;transition:box-shadow .3s ease;
  }
  .info-card:hover{box-shadow:var(--shadow)}
  .info-card .icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
  .info-card .icon.loc{background:#F0E6F5;color:#8B6BAE}
  .info-card .icon.tel{background:#E8F0E6;color:#6B8E5A}
  .info-card .icon.wx{background:#E6F0F5;color:#5A8BAE}
  .info-card h4{font-size:16px;font-weight:600;margin-bottom:6px}
  .info-card p{font-size:14px;color:var(--muted);line-height:1.7}
  .info-card .placeholder{color:#C4B8A8;font-style:italic}
  .info-card .qr-placeholder{
    margin-top:12px;width:100px;height:100px;border:2px dashed var(--line);border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#C4B8A8;
  }

  /* ===== 抽屉 ===== */
  .mask{
    position:fixed;inset:0;background:rgba(52,44,36,.4);
    opacity:0;transition:opacity .35s ease;z-index:90;backdrop-filter:blur(3px);
    pointer-events:none;
  }
  .mask.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(480px,92vw);
    background:#FFFDF7;z-index:95;
    transform:translateX(105%);transition:transform .45s cubic-bezier(.22,.61,.28,1);
    box-shadow:-20px 0 60px rgba(60,45,30,.18);
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0)}
  .drawer-head{padding:22px 22px 14px;border-bottom:1px solid var(--line)}
  .drawer-head .kicker{font-size:11px;letter-spacing:.22em;color:var(--coral);font-weight:600}
  .drawer-head h3{font-size:24px;font-family:Georgia,"Songti SC",serif;margin-top:5px}
  .drawer-head p{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.6}
  .drawer-body{flex:1;overflow-y:auto;padding:18px 22px 24px}
  .p-card{
    display:flex;gap:14px;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:12px;margin-bottom:14px;
    opacity:0;transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .p-card.in{opacity:1;transform:translateY(0)}
  .p-card .ph{width:88px;height:108px;border-radius:12px;overflow:hidden;flex:none;background:var(--paper)}
  .p-card .ph img{width:100%;height:100%;object-fit:cover}
  .p-card .info{display:flex;flex-direction:column;justify-content:center}
  .p-card .info .t{font-size:15px;font-weight:600}
  .p-card .info .d{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:4px}
  .p-card .info .tags{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .p-card .info .tags span{font-size:11px;padding:2px 9px;border-radius:999px;background:#F6EAE4;color:#B9685C}
  .drawer-foot{padding:14px 22px 22px}
  .drawer-foot button{
    width:100%;padding:13px;border-radius:999px;background:var(--ink);color:#FBF6EE;
    font-size:15px;transition:transform .2s, background .2s;
  }
  .drawer-foot button:hover{background:#000;transform:translateY(-1px)}
  .dose-note{
    margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6;
    background:#F6F0E6;border-radius:12px;padding:12px 14px;
  }

  /* 搭配详情 */
  .look-detail{display:none;position:fixed;inset:0;background:var(--paper);z-index:110;overflow-y:auto}
  .look-detail.show{display:block}
  .look-detail .hero-img{position:relative}
  .look-detail .hero-img img{width:100%;max-height:50vh;object-fit:cover}
  .look-detail .close{
    position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;
    background:rgba(255,253,246,.95);display:flex;align-items:center;justify-content:center;
    font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .2s;z-index:20;
  }
  .look-detail .close:hover{transform:rotate(90deg)}
  .look-detail .body{max-width:680px;margin:0 auto;padding:22px 20px 60px}
  .look-detail .day{font-size:12px;letter-spacing:.22em;color:var(--coral);font-weight:600}
  .look-detail h2{font-family:Georgia,"Songti SC",serif;font-size:28px;margin:8px 0 10px}
  .look-detail .sub{color:var(--muted);font-size:14px;line-height:1.7}
  .look-detail .items{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .look-detail .item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
  .look-detail .item b{font-size:13.5px;display:block}
  .look-detail .item span{font-size:12px;color:var(--muted);display:block;margin-top:3px}
  .look-detail .tip{
    margin-top:24px;background:#F3EFE4;border-radius:14px;padding:14px 16px;
    font-size:13px;color:#6E6255;line-height:1.7;
  }

  footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px;text-align:center;line-height:1.8}

  @media (max-width:640px){
    .topbar{padding:12px 14px}
    .brand .logo{font-size:20px}
    .brand small{display:none}
    .pill-btn{padding:7px 12px;font-size:12px}
    .drawer{width:100vw;max-width:100vw}
    .stage-hint{left:10px;right:10px;bottom:10px;justify-content:center;font-size:12px}
    .section-head{flex-direction:column;gap:6px;align-items:flex-start}
    .section-head .right{font-size:12px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">A<span>P</span></div>
    <small>Always Pretty</small>
  </div>
  <div class="right">
    <button class="pill-btn" onclick="document.getElementById('store-info').scrollIntoView({behavior:'smooth'})">联系店铺</button>
  </div>
</header>

<main>
  <!-- ==================== 逛店 ==================== -->
  <section id="tab-shop">
    <div class="stage-wrap" id="sceneWrap">
      <!-- 店外门面 -->
      <div class="stage scene active" id="scene-outside">
        <svg viewBox="0 0 1200 780" role="img" aria-label="服装店门面">
          <defs>
            <linearGradient id="skyG2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#DCE8EC"/><stop offset=".6" stop-color="#F0EDE4"/><stop offset="1" stop-color="#F7F0E4"/>
            </linearGradient>
            <linearGradient id="wallG2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FBF5EB"/><stop offset="1" stop-color="#F0E6D4"/>
            </linearGradient>
            <linearGradient id="glassG2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".5" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/>
            </linearGradient>
            <linearGradient id="doorG2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#F5E8D4" stop-opacity=".7"/><stop offset="1" stop-color="#E0CDB4" stop-opacity=".8"/>
            </linearGradient>
            <linearGradient id="awningG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#F4C5BA"/><stop offset="1" stop-color="#E8B0A4"/>
            </linearGradient>
            <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#E0D6C2"/><stop offset="1" stop-color="#D0C3A8"/>
            </linearGradient>
            <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
              <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8C7456" flood-opacity=".18"/>
            </filter>
          </defs>

          <!-- 天空 -->
          <rect width="1200" height="320" fill="url(#skyG2)"/>
          <ellipse cx="220" cy="100" rx="80" ry="28" fill="#fff" opacity=".75"/>
          <ellipse cx="270" cy="92" rx="50" ry="20" fill="#fff" opacity=".8"/>
          <ellipse cx="960" cy="80" rx="70" ry="24" fill="#fff" opacity=".65"/>

          <!-- 地面 -->
          <rect y="320" width="1200" height="460" fill="url(#groundG)"/>
          <line x1="0" y1="360" x2="1200" y2="360" stroke="#C9BCA2" stroke-width="2" opacity=".4"/>
          <line x1="0" y1="420" x2="1200" y2="420" stroke="#C9BCA2" stroke-width="2" opacity=".3"/>
          <line x1="0" y1="500" x2="1200" y2="500" stroke="#C9BCA2" stroke-width="2" opacity=".2"/>

          <!-- 店面投影 -->
          <ellipse cx="600" cy="640" rx="420" ry="18" fill="#000" opacity=".08" filter="blur(6px)"/>

          <!-- 店面墙体 -->
          <rect x="220" y="100" width="760" height="500" rx="6" fill="url(#wallG2)" stroke="#D8CBB4" stroke-width="2"/>
          <!-- 墙体顶部装饰线 -->
          <line x1="220" y1="100" x2="980" y2="100" stroke="#C9BBA0" stroke-width="3"/>
          <rect x="220" y="100" width="760" height="12" fill="#E8DCC6"/>

          <!-- 招牌 -->
          <rect x="270" y="128" width="660" height="66" rx="8" fill="#4A3F36" filter="url(#softShadow)"/>
          <rect x="270" y="128" width="660" height="66" rx="8" fill="none" stroke="#6B5B4E" stroke-width="1.5"/>
          <rect x="280" y="134" width="640" height="54" rx="4" fill="none" stroke="#5C4D42" stroke-width="1" opacity=".4"/>
          <text x="600" y="170" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#E8C99E" letter-spacing="4">AP</text>
          <text x="600" y="214" text-anchor="middle" font-size="13" fill="#B09A7E" letter-spacing="8">ALWAYS PRETTY</text>

          <!-- 雨棚（带褶皱和阴影） -->
          <g filter="url(#softShadow)">
            <!-- 雨棚顶板 -->
            <path d="M240,236 L960,236 L970,262 L230,262 Z" fill="url(#awningG)"/>
            <!-- 褶皱条纹 -->
            <g>
              <path d="M248,236 L256,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M284,236 L292,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M320,236 L328,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M356,236 L364,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M392,236 L400,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M428,236 L436,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M464,236 L472,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M500,236 L508,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M536,236 L544,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M572,236 L580,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M608,236 L616,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M644,236 L652,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M680,236 L688,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M716,236 L724,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M752,236 L760,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M788,236 L796,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M824,236 L832,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M860,236 L868,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M896,236 L904,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
              <path d="M932,236 L940,262" stroke="#D8A498" stroke-width="1.5" opacity=".5"/>
            </g>
            <!-- 雨棚底边波浪 -->
            <path d="M230,262 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 q18,12 36,0 L970,262 Z" fill="#E8B0A4"/>
          </g>

          <!-- 橱窗 A：上装 -->
          <g>
            <!-- 窗框 -->
            <rect x="250" y="286" width="160" height="340" rx="6" fill="#3B3733"/>
            <rect x="256" y="292" width="148" height="328" rx="4" fill="#F2EDE2"/>
            <!-- 玻璃反光 -->
            <rect x="256" y="292" width="148" height="328" rx="4" fill="url(#glassG2)"/>
            <!-- 挂衣杆 -->
            <line x1="270" y1="320" x2="390" y2="320" stroke="#A0886E" stroke-width="3" stroke-linecap="round"/>
            <!-- 衣架1：衬衫 -->
            <g transform="translate(290,322)">
              <path d="M-3,-4 L3,-4 M-3,-4 l-8,28 M3,-4 l8,28" stroke="#A0886E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <path d="M-16,24 h32 v12 a5,5 0 0 1 -5,5 h-22 a5,5 0 0 1 -5,-5 z" fill="#F5E8D0" stroke="#D8C49B" stroke-width="1.5"/>
              <line x1="-10" y1="28" x2="10" y2="28" stroke="#D8C49B" stroke-width=".8" opacity=".5"/>
              <circle cx="-8" cy="26" r="1.5" fill="#D8C49B"/>
              <circle cx="8" cy="26" r="1.5" fill="#D8C49B"/>
            </g>
            <!-- 衣架2：条纹衬衫 -->
            <g transform="translate(330,322)">
              <path d="M-3,-4 L3,-4 M-3,-4 l-8,28 M3,-4 l8,28" stroke="#A0886E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <path d="M-16,24 h32 v12 a5,5 0 0 1 -5,5 h-22 a5,5 0 0 1 -5,-5 z" fill="#D9E6F0" stroke="#A9C4D8" stroke-width="1.5"/>
              <line x1="-14" y1="28" x2="14" y2="28" stroke="#B8CFE0" stroke-width="1" opacity=".6"/>
              <line x1="-14" y1="32" x2="14" y2="32" stroke="#B8CFE0" stroke-width="1" opacity=".6"/>
            </g>
            <!-- 底座 -->
            <rect x="260" y="600" width="140" height="18" rx="3" fill="#D0C0A8"/>
            <text x="330" y="616" text-anchor="middle" font-size="14" fill="#8A7460" letter-spacing="2">上装 · 上新</text>
            <!-- 玻璃竖框 -->
            <rect x="328" y="292" width="4" height="328" fill="#3B3733" opacity=".3"/>
          </g>
          <rect class="hotzone" x="250" y="286" width="160" height="340" tabindex="0" data-zone="tops" aria-label="上装区上新"/>

          <!-- 橱窗 B：裙装 -->
          <g>
            <rect x="430" y="286" width="160" height="340" rx="6" fill="#3B3733"/>
            <rect x="436" y="292" width="148" height="328" rx="4" fill="#F2EDE2"/>
            <rect x="436" y="292" width="148" height="328" rx="4" fill="url(#glassG2)"/>
            <line x1="450" y1="320" x2="570" y2="320" stroke="#A0886E" stroke-width="3" stroke-linecap="round"/>

<script>

    kicker: "本周上新",

    desc: "陈列台上的是这周重点推的，数量不多，喜欢可以到店试。",
    items: [
      { img:"images/shirt-cream.jpg",  t:"奶白方领衬衫",     d:"法式方领 + 垂感面料，锁骨若隐若现，搭裤子和裙子都好看。", tags:["重点推荐"] },
      { img:"images/dress-floral.jpg", t:"米白碎花连衣裙",  d:"收腰不勒，春天感拉满，套针织开衫就是一套。", tags:["本周新品"] },
      { img:"images/jacket-khaki.jpg", t:"卡其工装夹克",     d:"轻薄短款，早晚挡风，配阔腿裤利落。", tags:["人气款"] },
      { img:"images/pants-wide.jpg",   t:"卡其高腰阔腿裤套装", d:"显瘦不紧绷，上身显高，顾客试了都带走。", tags:["销量王"] }

    items: [
      { img:"images/look-01.jpg", t:"法式通勤一套", d:"白衬衫 + 卡其阔腿裤 + 米色包，见人稳，不挑肤色。", tags:["今日搭配"] },
      { img:"images/look-04.jpg", t:"春日甜系一套", d:"粉开衫 + 碎花吊带裙，早晚披件衫，舒服不腻。", tags:["今日搭配"] },
      { img:"images/look-02.jpg", t:"蓝白休闲一套", d:"条纹衬衫 + 百褶裙 + 帆布鞋，逛街吃饭都清爽。", tags:["今日搭配"] }
    ]
  },
  cashier: {
    kicker: "收银台",
    title: "本周到店小福利",
    desc: "",
    items: [
      { img:"images/look-03.jpg", t:"优雅小黑裙一套", d:"晚上吃饭、姐妹聚会穿这条，配细项链就够有质感。", tags:["晚间推荐"] }
    ],
    note: "本周到店小福利：\n· 整单 9 折，买满 3 件再减一点\n· 老顾客带新朋友来，两单都按老顾客算\n· 试衣间对面有手写的搭配小抄，随便看"
  }
};

const LOOKS = [
  { img:"images/look-01.jpg", day:"本周一", name:"法式通勤风", sub:"白方领衬衫 + 卡其阔腿裤，颜色温和不挑人。",
    items:["白色方领衬衫","卡其高腰阔腿裤","浅米色腋下包","浅杏色平底鞋"],
    tip:"衬衫最上一粒扣可以松开，脖子显得长一点；裤子塞不塞衣摆都行，看你要利落还是随意。" },
  { img:"images/look-02.jpg", day:"本周二", name:"蓝白休闲风", sub:"条纹衬衫 + 百褶裙，清爽减龄，逛一天不累。",
    items:["蓝白条纹衬衫","白色百褶半身裙","白色帆布包","白色帆布鞋"],

  { img:"images/look-03.jpg", day:"本周三", name:"小黑裙晚风", sub:"黑色收腰连衣裙 + 细项链，简单两样就很贵气。",
    items:["黑色收腰连衣裙","银色细项链","黑色手拿包","裸色高跟凉鞋"],
    tip:"饰品少而精，一条细项链就够。怕冷带条披肩，晚风里也很出片。" },
  { img:"images/look-04.jpg", day:"本周四", name:"春日甜系风", sub:"粉开衫 + 碎花吊带裙，温柔，早晚披件正好。",
    items:["浅粉 V 领开衫","碎花吊带长裙","草编斜挎小包","米白凉鞋"],
    tip:"开衫扣一扣就好，露出吊带裙的领口更有层次。这套自己也留了一条。" }
];

/* ===================== 渲染 ===================== */
const $ = s => document.querySelector(s);

// 抽屉
function openDrawer(key){
  const z = ZONES[key]; if(!z) return;
  const head = $('#drawerHead');
  head.innerHTML = `<div class="kicker">${z.kicker}</div><h3>${z.title}</h3>${z.desc?`<p>${z.desc}</p>`:''}`;
  const body = $('#drawerBody');
  body.innerHTML = z.items.map((it,i)=>`
    <div class="p-card" style="transition-delay:${i*60}ms">
      <div class="ph"><img src="${it.img}" alt="${it.t}" loading="lazy"></div>
      <div class="info">
        <div class="t">${it.t}</div>
        <div class="d">${it.d}</div>
        <div class="tags">${it.tags.map(x=>`<span>${x}</span>`).join("")}</div>
      </div>
    </div>`).join("") + (z.note?`<div class="dose-note">${z.note.replace(/\n/g,"<br>")}</div>`:"");
  $('#mask').classList.add('show');
  $('#drawer').classList.add('show');
  $('#drawer').setAttribute('aria-hidden','false');
  requestAnimationFrame(()=> body.querySelectorAll('.p-card').forEach(c=>c.classList.add('in')));
}
function closeDrawer(){
  $('#drawer').classList.remove('show');
  $('#mask').classList.remove('show');
  $('#drawer').setAttribute('aria-hidden','true');
  setTimeout(()=>{ $('#drawerBody').innerHTML=""; },420);
}

// 场景切换
let sceneMode = 'out';
function enterShop(){
  if(sceneMode==='in') return;
  sceneMode='in';
  const out=$('#scene-outside'), inside=$('#scene-inside');
  out.classList.add('leaving');
  setTimeout(()=>{ out.hidden=true; out.classList.remove('active','leaving'); }, 520);
  inside.hidden=false;
  requestAnimationFrame(()=> requestAnimationFrame(()=> inside.classList.add('active')));
}
function exitShop(){
  if(sceneMode==='out') return;
  sceneMode='out';
  const out=$('#scene-outside'), inside=$('#scene-inside');
  inside.classList.remove('active'); inside.classList.add('leaving');
  setTimeout(()=>{ inside.hidden=true; inside.classList.remove('leaving'); }, 520);
  out.hidden=false;
  requestAnimationFrame(()=> requestAnimationFrame(()=>out.classList.add('active')));
}

// 事件
document.addEventListener('click', e=>{
  const z=e.target.closest('[data-zone]');
  if(!z) return;
  const key=z.dataset.zone;
  if(key==='enter'){ enterShop(); return; }
  openDrawer(key);
});
$('#drawerClose').addEventListener('click', closeDrawer);
$('#mask').addEventListener('click', closeDrawer);
$('#backOutside').addEventListener('click', exitShop);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeDrawer(); $('#lookDetail').classList.remove('show'); } });

// 每日搭配
function renderLooks(){
  $('#lookGrid').innerHTML = LOOKS.map((l,i)=>`
    <div class="look-card" data-look="${i}">
      <div class="thumb"><img src="${l.img}" alt="${l.name}" loading="lazy"></div>
      <div class="meta">
        <div class="day">${l.day}</div>
        <h3>${l.name}</h3>
        <p>${l.sub}</p>
        <span class="tag">点开看完整搭配</span>
      </div>
    </div>`).join("");
}
$('#lookGrid').addEventListener('click', e=>{
  const card=e.target.closest('.look-card'); if(!card) return;
  const l=LOOKS[+card.dataset.look];
  $('#lookDetailBody').innerHTML = `
    <div class="hero-img"><img src="${l.img}" alt="${l.name}"></div>
    <div class="body">
      <div class="day">${l.day} · 每日搭配</div>
      <h2>${l.name}</h2>
      <p class="sub">${l.sub}</p>
      <div class="items">${l.items.map(i=>`<div class="item"><b>${i}</b><span>可在店内试穿</span></div>`).join("")}</div>
      <div class="tip">搭配小抄：${l.tip}</div>
    </div>`;
  $('#lookDetail').classList.add('show');
  closeDrawer();
});
$('#lookClose').addEventListener('click', ()=> $('#lookDetail').classList.remove('show'));

renderLooks();
</script>
</body>
