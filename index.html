<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7f7f5'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%233b82f6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2310a37f'/%3E%3C/svg%3E">
<title>生活节拍器 v3 · 记录每一天的节奏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f7f7f5; --card: #ffffff;
  --ink: #37352f; --ink-2: #787774; --ink-3: #9f9e9b;
  --line: #e9e9e7; --line-2: #dedcd9;
  --hover: #f4f4f2; --soft: #fcfcfb;
  --blue: #3b82f6; --blue-deep: #2f6fd8; --blue-bg: #eef4fe;
  --green: #10a37f; --green-deep: #0c8c6d; --green-bg: #e7f6f0;
  --red: #e5484d; --red-deep: #d1373c; --red-bg: #fdeeee;
  --yellow: #e8a516; --yellow-deep: #c78a0d; --yellow-bg: #fdf5e0;
  --track: #f0f0ee;
  --btn-solid: #37352f; --btn-solid-text: #ffffff;
  --shadow: 0 1px 2px rgba(15,15,15,.05), 0 3px 10px rgba(15,15,15,.05);
  --shadow-lg: 0 10px 40px rgba(15,15,15,.14);
  --mask: rgba(15,15,15,.30);
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #171717; --card: #212121;
  --ink: #e9e8e5; --ink-2: #a5a49f; --ink-3: #77766f;
  --line: #333331; --line-2: #42423f;
  --hover: #292928; --soft: #1c1c1c;
  --blue-bg: #1c2a42; --green-bg: #173029; --red-bg: #3a1d1e; --yellow-bg: #3a3018;
  --track: #2c2c2a;
  --btn-solid: #e9e8e5; --btn-solid-text: #171717;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 3px 10px rgba(0,0,0,.25);
  --shadow-lg: 0 10px 40px rgba(0,0,0,.5);
  --mask: rgba(0,0,0,.55);
}
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; transition: background .25s, color .25s; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
input, textarea { font-family: inherit; outline: none; color: var(--ink); }
::selection { background: rgba(59,130,246,.25); }

/* ===== 顶部导航 ===== */
.topbar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1080px; margin: 0 auto; padding: 10px 16px 6px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 9px; user-select: none; }
.brand-logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#3b82f6 0%,#10a37f 34%,#e5484d 67%,#e8a516 100%); display: grid; place-items: center; box-shadow: 0 2px 8px rgba(59,130,246,.22); }
.brand-logo i { display: block; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
.brand-name { font-size: 15px; font-weight: 700; letter-spacing: .2px; }
.brand-sub { font-size: 10.5px; color: var(--ink-3); display: block; margin-top: -3px; }
.nav-spacer { flex: 1; }
.month-nav { display: flex; align-items: center; gap: 2px; }
.month-label { font-size: 14px; font-weight: 700; min-width: 84px; text-align: center; font-variant-numeric: tabular-nums; }
.icon-btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); transition: all .15s; font-size: 15px; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
.btn-today { padding: 6px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 600; background: var(--btn-solid); color: var(--btn-solid-text); transition: all .15s; }
.btn-today:hover { transform: translateY(-1px); opacity: .92; }
.btn-ghost { padding: 6px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line); background: var(--card); transition: all .15s; }
.btn-ghost:hover { border-color: var(--line-2); color: var(--ink); }
.btn-ghost svg { vertical-align: -2px; }

/* ===== Tab 导航 ===== */
.tabs { max-width: 1080px; margin: 0 auto; padding: 0 10px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1; min-width: 72px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 9px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; transition: all .15s; letter-spacing: .5px; }
.tab svg { width: 17px; height: 17px; }
.tab-emoji { font-size: 17px; line-height: 1; }
.tab:hover { color: var(--ink-2); }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); }
.tab .badge { position: absolute; }
.tab { position: relative; }
.tab-dot { position: absolute; top: 5px; right: calc(50% - 24px); width: 7px; height: 7px; border-radius: 50%; background: var(--red); display: none; }
.tab.has-news .tab-dot { display: block; }

/* ===== 布局 ===== */
.wrap { max-width: 1080px; margin: 0 auto; padding: 16px 14px 60px; }
.page { animation: fadeUp .28s ease; }
.page[hidden] { display: none; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.card-title .sub { font-weight: 400; font-size: 11.5px; color: var(--ink-3); margin-left: auto; }

/* ===== 月度摘要 ===== */
.summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.sum-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px; display: flex; flex-direction: column; gap: 1px; }
.sum-label { font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.sum-val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sum-val .unit { font-size: 11px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.sum-dot { width: 7px; height: 7px; border-radius: 50%; }
.pos-c { color: var(--green-deep); }
.neg-c { color: var(--red-deep); }

/* ===== 日历 ===== */
.cal-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
.cal-head span { text-align: center; font-size: 11.5px; font-weight: 600; color: var(--ink-3); padding: 3px 0; letter-spacing: 1px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-cell { background: var(--card); border: 1px solid var(--line); border-radius: 10px; min-height: 108px; padding: 8px 9px 7px; cursor: pointer; position: relative; display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s, transform .15s; }
.cal-cell:hover { border-color: var(--line-2); box-shadow: var(--shadow); transform: translateY(-1px); }
.cal-cell.dim { background: var(--soft); }
.cal-cell.dim .day-num { color: var(--ink-3); opacity: .5; }
.cal-cell.today { border: 1.5px solid var(--blue-deep); box-shadow: 0 0 0 3px rgba(59,130,246,.13); }
.cal-cell.today .day-num { background: var(--blue); color: #fff; border-radius: 50%; }
.cal-cell.sel { border-color: var(--ink); box-shadow: var(--shadow); }
.ebar { position: relative; height: 5px; border-radius: 3px; background: var(--track); margin-bottom: 6px; overflow: hidden; flex-shrink: 0; }
.ebar::before { content: ''; position: absolute; left: calc(50% - .5px); width: 1px; height: 100%; background: rgba(120,120,118,.35); z-index: 2; }
.ebar .fill { position: absolute; top: 0; bottom: 0; }
.ebar .fill.pos { left: 50%; background: linear-gradient(90deg, #35c48c, var(--green)); border-radius: 0 3px 3px 0; }
.ebar .fill.neg { right: 50%; background: linear-gradient(90deg, var(--red), #f07f83); border-radius: 3px 0 0 3px; }
.ebar-idle { height: 5px; margin-bottom: 6px; flex-shrink: 0; }
.day-num { font-size: 12.5px; font-weight: 600; width: 23px; height: 23px; display: grid; place-items: center; margin-bottom: 1px; }
.today-flag { position: absolute; top: 7px; right: 8px; font-size: 9.5px; font-weight: 700; color: var(--blue-deep); background: var(--blue-bg); padding: 1px 6px; border-radius: 99px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; margin-top: auto; padding-top: 5px; max-height: 40px; overflow: hidden; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dot.done { background: currentColor; }
.dot.todo { background: transparent; border: 1.5px solid currentColor; opacity: .55; }
.dot.more { background: none; border: none; width: auto; height: auto; font-size: 10px; font-weight: 600; color: var(--ink-3); line-height: 1; margin-top: -1px; }
.day-glow { font-size: 10.5px; color: var(--ink-3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 11px; position: relative; flex-shrink: 0; }
.day-glow::before { content: '✎'; position: absolute; left: 0; font-size: 8.5px; color: var(--yellow-deep); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 4px 2px; font-size: 11px; color: var(--ink-3); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-bar { width: 20px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--track), var(--green)); }
.legend-bar.n { background: linear-gradient(90deg, var(--red), var(--track)); }
/* ===== 通用 chips ===== */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-row-label { font-size: 11px; color: var(--ink-3); margin-right: 2px; }
.chip { font-size: 12px; font-weight: 500; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); background: var(--card); transition: all .13s; display: inline-flex; align-items: center; gap: 5px; user-select: none; }
.chip:hover { border-color: var(--line-2); }
.chip .cdot { width: 7px; height: 7px; border-radius: 50%; }
.chip.on { font-weight: 600; background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.on.c-blue { background: var(--blue-bg); border-color: var(--blue); color: var(--blue-deep); }
.chip.on.c-green { background: var(--green-bg); border-color: var(--green); color: var(--green-deep); }
.chip.on.c-red { background: var(--red-bg); border-color: var(--red); color: var(--red-deep); }
.chip.on.c-yellow { background: var(--yellow-bg); border-color: var(--yellow); color: var(--yellow-deep); }
.chip.on.c-neg { background: var(--red-bg); border-color: var(--red); color: var(--red-deep); font-variant-numeric: tabular-nums; }
.chip.on.c-pos { background: var(--green-bg); border-color: var(--green); color: var(--green-deep); font-variant-numeric: tabular-nums; }
.energy-divider { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }

/* ===== 统计页 ===== */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.donut-flex { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut-svg { width: 150px; height: 150px; flex-shrink: 0; }
.donut-legend { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 9px; }
.dl-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.dl-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dl-name { color: var(--ink-2); width: 62px; }
.dl-bar { flex: 1; height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
.dl-bar i { display: block; height: 100%; border-radius: 4px; }
.dl-num { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 24px; text-align: right; }
.dl-pct { color: var(--ink-3); font-size: 11px; min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.curve-box { width: 100%; overflow: hidden; }
.curve-svg { width: 100%; height: auto; display: block; }
.curve-svg text { fill: var(--ink-3); font-size: 10px; font-family: var(--font); }
.curve-svg .cbar { fill: var(--blue); opacity: .22; rx: 1.5; }
.curve-svg .cline { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.curve-svg .carea { opacity: .13; }
.curve-svg .czero { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 4; opacity: .6; }
.curve-svg circle { cursor: pointer; stroke: var(--card); stroke-width: 1.5; }
.curve-svg circle.cur { stroke: var(--ink); }
.curve-info { margin-top: 10px; border: 1px dashed var(--line-2); border-radius: 10px; padding: 10px 13px; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.curve-info b { color: var(--ink); font-size: 13px; }
.curve-hint { font-size: 11px; color: var(--ink-3); margin-top: 8px; text-align: center; }

/* ===== 复盘页 ===== */
.rep-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.rep-label { flex: 1; text-align: center; font-size: 15px; font-weight: 700; }
.score-flex { display: flex; align-items: center; gap: 18px; }
.score-num { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.score-grad { font-size: 13px; font-weight: 600; margin-top: 5px; }
.score-bars { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }
.sb-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-2); }
.sb-name { width: 56px; flex-shrink: 0; }
.sb-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.sb-bar i { display: block; height: 100%; border-radius: 3px; background: var(--ink-2); }
.sb-val { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.rlist { list-style: none; }
.rlist li { display: flex; gap: 10px; padding: 7px 2px; border-bottom: 1px dashed var(--line); font-size: 13px; align-items: baseline; }
.rlist li:last-child { border-bottom: none; }
.rlist .rdate { flex-shrink: 0; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 38px; font-weight: 600; }
.rlist .rtext { flex: 1; color: var(--ink); word-break: break-all; }
.rlist-empty { text-align: center; color: var(--ink-3); font-size: 12.5px; padding: 12px 0; }
.star-day { display: flex; align-items: center; gap: 14px; }
.star-emoji { font-size: 30px; }
.star-main { flex: 1; min-width: 0; }
.star-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.star-sub { font-size: 12px; color: var(--ink-2); }

/* ===== 寄语页 ===== */
.cap-form textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); padding: 11px 13px; font-size: 14px; resize: vertical; min-height: 88px; transition: border-color .15s, background .15s; line-height: 1.6; }
.cap-form textarea:focus, .cap-form input:focus { border-color: #c9c8c5; background: var(--card); }
.cap-form textarea::placeholder, .cap-form input::placeholder { color: var(--ink-3); opacity: .7; }
.cap-form input[type="date"] { border: 1px solid var(--line); border-radius: 10px; background: var(--soft); padding: 9px 12px; font-size: 13.5px; color: var(--ink); flex: 1; min-width: 0; }
.cap-send { padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; background: var(--btn-solid); color: var(--btn-solid-text); transition: all .15s; white-space: nowrap; }
.cap-send:hover { opacity: .9; }
.cap-send:active { transform: scale(.97); }
.cap-tip { font-size: 11.5px; color: var(--ink-3); margin-top: 9px; display: flex; align-items: center; gap: 5px; }
.cap-group-title { font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: 1px; margin: 18px 2px 9px; display: flex; align-items: center; gap: 8px; }
.cap-group-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.cap-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; margin-bottom: 10px; position: relative; }
.cap-card.readable { border-color: var(--yellow); background: linear-gradient(180deg, var(--yellow-bg), var(--card) 70%); }
.cap-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 7px; }
.cap-chip { font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.cap-chip.wait { background: var(--blue-bg); color: var(--blue-deep); }
.cap-chip.ready { background: var(--yellow-bg); color: var(--yellow-deep); animation: pulse 1.6s infinite; }
.cap-chip.read { background: var(--green-bg); color: var(--green-deep); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
.cap-date { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cap-text { font-size: 13.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-all; }
.cap-locked .cap-text { filter: blur(5px); user-select: none; pointer-events: none; }
.cap-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.cap-open-btn { padding: 7px 16px; border-radius: 9px; font-size: 12.5px; font-weight: 700; background: var(--yellow); color: #fff; transition: all .15s; }
.cap-open-btn:hover { transform: translateY(-1px); }
.cap-open-btn:active { transform: scale(.96); }
.cap-del { font-size: 11.5px; color: var(--ink-3); margin-left: auto; padding: 5px 8px; border-radius: 7px; }
.cap-del:hover { background: var(--red-bg); color: var(--red); }
.cap-countdown { font-size: 12px; color: var(--ink-2); }
.cap-empty { text-align: center; color: var(--ink-3); font-size: 13px; padding: 26px 0; line-height: 2; }

/* ===== 抽屉 ===== */
.mask { position: fixed; inset: 0; z-index: 40; background: var(--mask); opacity: 0; pointer-events: none; transition: opacity .3s; }
.mask.show { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: 430px; max-width: 100vw; background: var(--card); box-shadow: var(--shadow-lg); transform: translateX(106%); transition: transform .34s cubic-bezier(.22,1,.36,1); display: flex; flex-direction: column; }
.drawer.open { transform: translateX(0); }
.dr-head { padding: 16px 20px 13px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.dr-date { flex: 1; min-width: 0; }
.dr-date .big { font-size: 18px; font-weight: 700; line-height: 1.3; }
.dr-date .sub { font-size: 11.5px; color: var(--ink-3); }
.dr-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
.dr-body::-webkit-scrollbar { width: 8px; }
.dr-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; border: 2px solid var(--card); }
.energy-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; background: var(--soft); margin-bottom: 16px; }
.energy-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.energy-num { font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.energy-hint { font-size: 12px; color: var(--ink-2); flex: 1; }
.energy-bar { position: relative; height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
.energy-bar::before { content: ''; position: absolute; left: calc(50% - .5px); width: 1px; height: 100%; background: rgba(120,120,118,.35); z-index: 2; }
.energy-bar .fill { position: absolute; top: 0; bottom: 0; }
.energy-bar .fill.pos { left: 50%; background: linear-gradient(90deg, #35c48c, var(--green)); border-radius: 0 4px 4px 0; }
.energy-bar .fill.neg { right: 50%; background: linear-gradient(90deg, var(--red), #f07f83); border-radius: 4px 0 0 3px; }
.energy-forecast { font-size: 11px; color: var(--ink-3); margin-top: 7px; }
.sec-title { font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: 1.5px; margin: 18px 0 9px; display: flex; align-items: center; gap: 8px; }
.sec-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* ===== Toast / 模态 ===== */
.toast { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -72px); z-index: 99; background: var(--btn-solid); color: var(--btn-solid-text); font-size: 13px; font-weight: 500; padding: 9px 18px; border-radius: 99px; box-shadow: var(--shadow-lg); transition: transform .3s cubic-bezier(.22,1,.36,1); pointer-events: none; max-width: 86vw; text-align: center; }

@keyframes popIn { from { transform: scale(.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-emoji { font-size: 40px; margin-bottom: 12px; }

<body>

<script>
'use strict';
/* ===== 常量 ===== */
const CATS = {
  study:  { name: '📚 学习/提升', hex: '#3b82f6', cls: 'c-blue' },
  daily:  { name: '🧺 日常/家务', hex: '#10a37f', cls: 'c-green' },
  health: { name: '💪 健康/运动', hex: '#e5484d', cls: 'c-red' },
  fun:    { name: '🎉 休闲/社交', hex: '#e8a516', cls: 'c-yellow' }
};
const CAT_KEYS = ['study', 'daily', 'health', 'fun'];
const ENERGY_OPTS = [-3, -2, -1, 1, 2, 3];
const MAX_DOTS = 8;
const LS_KEY = 'lifemetronome.data';
const LS_V1 = 'lifemetronome.v1';
const LS_V2 = 'lifemetronome.v2';
const LS_THEME = 'lifemetronome.theme';
const WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
const MOODS = ['😄', '🙂', '😐', '😔', '🔋'];

/* ===== 状态 ===== */
let DB = { days: {}, capsules: [], favs: [] };
let view = { y: 0, m: 0 };
let sel = null;
let curTab = 'cal';
let draft = { cat: 'study', energy: -2 };
let statPeriod = 7;
let repMode = 'week';
let repOffset = 0;
let saveTimers = {};
let toastTimer = null;

/* ===== 工具 ===== */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const pad = n => (n < 10 ? '0' : '') + n;
const keyOf = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);
const keyOfDate = dt => keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
const dateFromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dt, n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
const todayKey = () => keyOfDate(new Date());
const diffDays = (a, b) => Math.round((dateFromKey(b) - dateFromKey(a)) / 86400000);
function peek(k) { return DB.days[k] || { tasks: [], reflect: { good: '', improve: '', tomorrow: '' } }; }
function ensureDay(k) { if (!DB.days[k]) DB.days[k] = { tasks: [], reflect: { good: '', improve: '', tomorrow: '' } }; return DB.days[k]; }
function energyDone(k) { return peek(k).tasks.reduce((s, t) => s + t.energy, 0); }
function hasReflect(k) { const r = peek(k).reflect || {}; return !!(r.good || r.improve || r.tomorrow); }
function hasRecord(k) { const d = peek(k); return d.tasks.length > 0 || hasReflect(k); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtMD(k) { const [y, m, d] = k.split('-'); return (+m) + '/' + (+d); }

/* 当前连续记录天数 */
function streak() {
  let n = 0, cur = new Date();
  if (!hasRecord(keyOfDate(cur))) cur = addDays(cur, -1);
  while (hasRecord(keyOfDate(cur))) { n++; cur = addDays(cur, -1); }
  return n;
}
/* 历史最长连续记录 */
function maxStreak() {
  const keys = Object.keys(DB.days).filter(hasRecord).sort();
  if (!keys.length) return 0;
  let best = 1, run = 1;
  for (let i = 1; i < keys.length; i++) {
    if (diffDays(keys[i - 1], keys[i]) === 1) { run++; if (run > best) best = run; }
    else run = 1;
  }
  return best;
}

/* ===== 持久化与迁移 =====
   💾 LS_KEY（lifemetronome.data）是永久数据键：
   以后所有版本的「生活节拍器」都只读写这一个键，更新文件/升级版本不会丢数据 */
function save() { try { DB.ver = 3; localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {} }
function load() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function normalizeDay(v) {
  const tasks = Array.isArray(v.tasks) ? v.tasks.filter(t => t && t.text && CATS[t.cat]).map(t => ({
    id: String(t.id || Math.random()), text: String(t.text).slice(0, 60), cat: t.cat,
    energy: Number(t.energy) || 0, done: true
  })) : [];
  let reflect = { good: '', improve: '', tomorrow: '' };
  if (v.reflect && typeof v.reflect === 'object') {
    ['good', 'improve', 'tomorrow'].forEach(f => { if (typeof v.reflect[f] === 'string') reflect[f] = v.reflect[f].slice(0, 200); });
  } else if (typeof v.glow === 'string') reflect.good = v.glow.slice(0, 200);
  return { tasks, reflect };
}
function normalizeDB(obj) {
  const out = { days: {}, capsules: [], favs: [] };
  if (!obj || typeof obj !== 'object') return out;
  if (obj.days && typeof obj.days === 'object') {
    Object.keys(obj.days).forEach(k => { if (/^\d{4}-\d{2}-\d{2}$/.test(k)) out.days[k] = normalizeDay(obj.days[k] || {}); });
    if (Array.isArray(obj.capsules)) out.capsules = obj.capsules.filter(c => c && c.text && c.openDate).map(c => ({
      id: String(c.id || Math.random()), text: String(c.text).slice(0, 500),
      openDate: c.openDate, createdAt: c.createdAt || c.openDate, readAt: c.readAt || null
    }));
    if (Array.isArray(obj.favs)) out.favs = obj.favs.slice(0, 12);
  } else {

}
function migrateOld() {

function donutSVG(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const cx = 80, cy = 80, r = 58, sw = 20;
  if (!total) return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
    <text x="80" y="76" text-anchor="middle" style="fill:var(--ink-3);font-size:16px;font-weight:700">🌱</text>
    <text x="80" y="94" text-anchor="middle" style="fill:var(--ink-3);font-size:10px">还没有记录</text>`;
  const C = 2 * Math.PI * r;
  let acc = 0, segs = '';
  CAT_KEYS.forEach(c => {
    const v = counts[c];
    if (!v) return;
    const frac = v / total;
    const off = -0.25 + acc;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CATS[c].hex}" stroke-width="${sw}"
      stroke-dasharray="${(frac * C - 2).toFixed(1)} ${(C - frac * C + 2).toFixed(1)}"
      stroke-dashoffset="${(off * C).toFixed(1)}" stroke-linecap="butt"/>`;
    acc += frac;
  });
  return segs + `<text x="80" y="77" text-anchor="middle" style="fill:var(--ink);font-size:22px;font-weight:800">${total}</text>
    <text x="80" y="95" text-anchor="middle" style="fill:var(--ink-3);font-size:10.5px">件完成 ✨</text>`;
}
function buildCurve(entries) {
  const W = 760, H = 210, padL = 34, padR = 16;
  const lineTop = 14, zeroY = 128, barBot = 196;
  const n = entries.length;
  const innerW = W - padL - padR;
  const step = n > 1 ? innerW / (n - 1) : 0;
  const x = i => padL + (n > 1 ? i * step : innerW / 2);
  const maxE = Math.max(4, ...entries.map(p => Math.abs(p.energy)));
  const maxD = Math.max(3, ...entries.map(p => p.done));
  const y = v => zeroY - (v / maxE) * (zeroY - lineTop) * (v >= 0 ? 1 : -0.72);
  let grid = '', labels = '', bars = '', pts = '';
  entries.forEach((p, i) => {
    const px = x(i);
    const bh = (p.done / maxD) * (barBot - zeroY - 8);
    if (p.done) bars += `<rect class="cbar" x="${(px - Math.min(9, step * 0.32)).toFixed(1)}" y="${(zeroY + 8 + (barBot - zeroY - 8) - bh).toFixed(1)}" width="${(Math.min(18, Math.max(4, step * 0.64))).toFixed(1)}" height="${bh.toFixed(1)}" rx="2"/>`;
    if (p.energy) pts += `<circle data-k="${p.k}" cx="${px.toFixed(1)}" cy="${y(p.energy).toFixed(1)}" r="4" fill="${p.energy > 0 ? 'var(--green)' : 'var(--red)'}"/>`;
    if (i === 0 || i === n - 1 || (n > 12 && i % Math.ceil(n / 8) === 0)) {
      labels += `<text x="${px.toFixed(1)}" y="208" text-anchor="middle">${fmtMD(p.k)}</text>`;
    }
  });
  const linePts = entries.map((p, i) => `${x(i).toFixed(1)},${y(p.energy).toFixed(1)}`).join(' ');
  const area = `M ${x(0).toFixed(1)},${zeroY} ` + entries.map((p, i) => `L ${x(i).toFixed(1)},${y(p.energy).toFixed(1)}`).join(' ') + ` L ${x(n - 1).toFixed(1)},${zeroY} Z`;
  return `<svg class="curve-svg" viewBox="0 0 ${W} ${H}">
    <line class="czero" x1="${padL - 6}" y1="${zeroY}" x2="${W - 6}" y2="${zeroY}"/>
    <text x="${padL - 10}" y="${lineTop + 4}" text-anchor="end">${maxE}</text>
    <text x="${padL - 10}" y="${zeroY + 4}" text-anchor="end">0</text>
    <text x="${padL - 10}" y="${barBot}" text-anchor="end">${maxD}</text>
    ${bars}
    <path class="carea" d="${area}" fill="var(--green)"/>
    <polyline class="cline" points="${linePts}"/>
    ${pts}
    ${labels}
  </svg>`;
}

function repRange() {

  }
  if (repMode === 'month') {
    const base = new Date(today.getFullYear(), today.getMonth() + repOffset, 1);
    const from = keyOf(base.getFullYear(), base.getMonth(), 1);
    const to = keyOf(base.getFullYear(), base.getMonth(), new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate());
    return { from, to, label: base.getFullYear() + ' 年 ' + (base.getMonth() + 1) + ' 月' };

      showModal({
        emoji: '🗑', title: '删除这封信？', text: '删除后将无法找回',
        btns: [{ label: '取消', plain: true }, { label: '删除', primary: true, onClick: () => { DB.capsules = DB.capsules.filter(c => c.id !== id); save(); renderCapsules(); toast('🗑 已删除'); } }]
      });
    }
  });

  $('#btnExport').onclick = () => {
    if (!Object.keys(DB.days).length && !DB.capsules.length) { toast('📦 暂无数据可备份'); return; }
    const blob = new Blob([JSON.stringify({ app: 'lifemetronome', ver: 3, exportedAt: new Date().toISOString(), ...DB }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '生活节拍器备份-' + todayKey() + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('✅ 备份已下载');
  };
  $('#btnImport').onclick = () => $('#fileImport').click();
  $('#fileImport').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        DB = normalizeDB(JSON.parse(r.result));
        save();
        renderCalendar(); renderSummary(); renderCapsules();
        if (curTab === 'stats') renderStats();
        if (curTab === 'report') renderReport();
        toast('✅ 数据已恢复');
      } catch (err) { toast('😅 文件格式不正确'); }
      e.target.value = '';
    };
    r.readAsText(f, 'utf-8');
  });
}

/* ===== 启动 ===== */
(function init() {
  migrateOld();
  const loaded = load();
  if (loaded) DB = normalizeDB(loaded);
  if (!Object.keys(DB.days).length && !DB.capsules.length) seedDemo();
  save();
  const t = new Date();
  view = { y: t.getFullYear(), m: t.getMonth() };
  initTheme();
  const capDate = $('#capDate');
  capDate.value = keyOfDate(addDays(t, 30));
  capDate.min = keyOfDate(addDays(t, 1));
  bind();
  renderCalendar();
  renderSummary();
  checkCapsuleNews();
})();

/* ===== 静态托管平台角标清理（CodeSandbox 注入的右下角水印，本地文件无影响） ===== */
try {
  const style = document.createElement('style');
  style.textContent = 'iframe[style*="z-index: 9999999999999"]{display:none!important}';
  document.head.appendChild(style);
  const isBadge = n => n && n.tagName === 'IFRAME' && !n.src && n.style.position === 'fixed' && n.style.zIndex === '9999999999999';
  new MutationObserver(list => {
    list.forEach(m => m.addedNodes.forEach(n => { if (isBadge(n)) n.remove(); }));
  }).observe(document.body, { childList: true });
} catch (e) {}
